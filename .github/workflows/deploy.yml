name: 部署 cfpay

# 触发方式：push 到 main、手动 dispatch。
# 凭据：仓库 secret CLOUDFLARE_API_TOKEN（Cloudflare 用户 API 令牌）。
#   需要权限：Workers Scripts:Edit、Workers Routes:Edit、D1:Edit。
# 仓库不保存任何生产标识：部署时用 CLOUDFLARE_API_TOKEN 自动发现 Account ID、
# cfpay_db 的 D1 ID 与 cfpay 已绑定的自定义域名。也可用仓库变量
# CLOUDFLARE_ACCOUNT_ID、CFPAY_D1_DATABASE_ID、CFPAY_DOMAIN 覆盖。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cfpay
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CFPAY_D1_DATABASE_ID: ${{ vars.CFPAY_D1_DATABASE_ID }}
  CFPAY_DOMAIN: ${{ vars.CFPAY_DOMAIN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 校验凭据
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::仓库缺少 CLOUDFLARE_API_TOKEN secret。请在 Settings → Secrets and variables → Actions 里添加 Cloudflare API 令牌（Workers Scripts:Edit、Workers Routes:Edit、D1:Edit）。"
            exit 1
          fi
          echo "凭据已配置，部署参数将由令牌自动发现。"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: 安装主项目依赖
        run: npm ci

      - name: 安装后台依赖
        run: npm --prefix admin-ui ci

      - name: 校验令牌是否有效
        run: npx wrangler whoami

      # admin:build 会先交叉编译 Windows 单 EXE，再把工件打入前端静态资源；
      # ubuntu-latest 默认没有 MinGW，因此部署任务必须显式安装与 Release 工作流相同的工具链。
      - name: 安装 Windows 交叉编译工具链
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 \
            cmake \
            ninja-build
          x86_64-w64-mingw32-g++ --version | head -n1
          cmake --version | head -n1

      # admin-ui 构建输出到 ../public/admin-app；漏掉这一步部署出去就是个没有后台的站点。
      - name: 构建后台
        run: npm run admin:build

      # 与本地一致：按仓库变量生成临时部署配置，先应用未执行的远程迁移，再发布 Worker。
      # 迁移会改动生产库；不需要自动迁移就删掉 tools/deploy.mjs 里的迁移调用。
      - name: 应用 D1 远程迁移并部署 Worker
        run: node tools/deploy.mjs

      - name: 输出摘要
        if: success()
        run: |
          {
            echo "### cfpay 部署完成"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 触发：${{ github.event_name }}"
            echo "- 站点：https://${{ vars.CFPAY_DOMAIN }}"
          } >> "$GITHUB_STEP_SUMMARY"
